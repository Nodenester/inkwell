<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13z' fill='%235b8def'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar" aria-label="Tools">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13z" fill="currentColor"/>
      </svg>
      <h1>Inkwell</h1>
    </header>

    <section class="panel" aria-label="File">
      <h2 class="panel-title">File</h2>
      <button type="button" id="open-btn" class="btn btn-primary">
        Open Image <kbd>Ctrl+O</kbd>
      </button>
      <button type="button" id="download-btn" class="btn" disabled>
        Download PNG <kbd>Ctrl+S</kbd>
      </button>
      <input type="file" accept="image/*" id="file-input" hidden>
    </section>

    <section class="panel" id="history-panel" aria-label="History">
      <h2 class="panel-title">History</h2>
      <div class="btn-row">
        <button type="button" id="undo-btn" class="btn" disabled>Undo <kbd>Ctrl+Z</kbd></button>
        <button type="button" id="redo-btn" class="btn" disabled>Redo <kbd>Ctrl+Y</kbd></button>
      </div>
    </section>

    <section class="panel" id="adjust-panel" aria-label="Adjust">
      <h2 class="panel-title">Adjust</h2>

      <div class="slider-row">
        <label for="adjust-brightness">Brightness</label>
        <output class="slider-value" id="brightness-value" for="adjust-brightness">0</output>
        <input type="range" id="adjust-brightness" min="-100" max="100" step="1" value="0" disabled>
      </div>

      <div class="slider-row">
        <label for="adjust-contrast">Contrast</label>
        <output class="slider-value" id="contrast-value" for="adjust-contrast">0</output>
        <input type="range" id="adjust-contrast" min="-100" max="100" step="1" value="0" disabled>
      </div>

      <div class="slider-row">
        <label for="adjust-saturation">Saturation</label>
        <output class="slider-value" id="saturation-value" for="adjust-saturation">0</output>
        <input type="range" id="adjust-saturation" min="-100" max="100" step="1" value="0" disabled>
      </div>

      <div class="slider-row">
        <label for="adjust-blur">Blur</label>
        <output class="slider-value" id="blur-value" for="adjust-blur">0</output>
        <input type="range" id="adjust-blur" min="0" max="20" step="1" value="0" disabled>
      </div>

      <div class="btn-row">
        <button type="button" id="toggle-grayscale" class="btn btn-toggle" aria-pressed="false" disabled>Grayscale</button>
        <button type="button" id="toggle-invert" class="btn btn-toggle" aria-pressed="false" disabled>Invert</button>
      </div>

      <div class="btn-row">
        <button type="button" id="apply-adjust" class="btn btn-primary" disabled>Apply</button>
        <button type="button" id="reset-adjust" class="btn" disabled>Reset</button>
      </div>
    </section>

    <section class="panel" id="brush-panel" aria-label="Brush">
      <h2 class="panel-title">Brush</h2>

      <button type="button" id="brush-toggle" class="btn btn-toggle" aria-pressed="false" disabled>
        Brush <kbd>B</kbd>
      </button>

      <div class="color-row">
        <label for="brush-color">Color</label>
        <input type="color" id="brush-color" value="#5b8def" disabled>
      </div>

      <div class="slider-row">
        <label for="brush-size">Size</label>
        <output class="slider-value" id="brush-size-value" for="brush-size">12</output>
        <input type="range" id="brush-size" min="1" max="100" step="1" value="12" disabled>
      </div>

      <div class="btn-row" role="group" aria-label="Brush mode">
        <button type="button" id="brush-mode-paint" class="btn btn-toggle" aria-pressed="true" disabled>Paint</button>
        <button type="button" id="brush-mode-erase" class="btn btn-toggle" aria-pressed="false" disabled>Erase</button>
      </div>
    </section>

    <section class="panel" id="crop-panel" aria-label="Crop">
      <h2 class="panel-title">Crop</h2>

      <button type="button" id="crop-toggle" class="btn btn-toggle" aria-pressed="false" disabled>
        Crop <kbd>C</kbd>
      </button>

      <div class="btn-row">
        <button type="button" id="crop-apply" class="btn btn-primary" disabled>Apply</button>
        <button type="button" id="crop-cancel" class="btn" disabled>Cancel <kbd>Esc</kbd></button>
      </div>
    </section>

    <section class="panel" id="resize-panel" aria-label="Resize">
      <h2 class="panel-title">Resize</h2>

      <div class="size-grid">
        <label for="resize-width">Width</label>
        <input type="number" id="resize-width" min="1" max="10000" step="1" disabled>
        <label for="resize-height">Height</label>
        <input type="number" id="resize-height" min="1" max="10000" step="1" disabled>
      </div>

      <button type="button" id="resize-lock" class="btn btn-toggle" aria-pressed="true" disabled>
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        Lock ratio
      </button>

      <button type="button" id="resize-apply" class="btn btn-primary" disabled>Apply Resize</button>
    </section>

    <footer class="status">
      <span id="image-info">No image</span>
    </footer>
  </aside>

  <main id="workspace" aria-label="Canvas workspace">
    <div id="drop-hint">
      <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
        <rect x="6" y="10" width="36" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
        <circle cx="17" cy="20" r="3.5" fill="currentColor"/>
        <path d="M10 34l9-9 6 6 7-8 6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <p class="hint-main">Drop an image here</p>
      <p class="hint-sub">or press <strong>Open Image</strong> (Ctrl+O) to browse</p>
    </div>
    <div class="canvas-frame" hidden>
      <div class="canvas-stack">
        <canvas id="canvas"></canvas>
        <div id="crop-overlay" hidden>
          <div id="crop-rect" hidden>
            <span id="crop-size-readout">0 × 0 px</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
